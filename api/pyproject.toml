[project]
name = "automind-api"
version = "0.1.0"
description = "automl service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # -------------------- math --------------------
  "pandas",
  "numpy",


  # -------------------- database --------------------
  "sqlalchemy",
  "mindsdb_sdk",
  "sly",

  # -------------------- console --------------------
  "wcwidth",
  "rich",
  "tqdm",

  # -------------------- driver --------------------
  "pyodbc",
  "pymysql",


  # -------------------- api --------------------
  "fastapi[standard]",
  "fastapi_utils",
  "python-multipart",
  "orjson",

  # -------------------- automind core --------------------
  "automind",

  # -------------------- type stubs --------------------
  "pandas-stubs",
  # "scipy-stubs",
  "microsoft-python-type-stubs@git+https://github.com/microsoft/python-type-stubs.git",

  # -------------------- other --------------------
  "openai",
  "debugpy",
  "pdm",
]

# install self
[build-system]
requires = ["setuptools"]

# pdm command
[tool.pdm.scripts]

# more setting refer to: https://microsoft.github.io/pyright/#/configuration?id=sample-pyprojecttoml-file
[tool.pyright]
include = ["src"]
reportMissingTypeStubs = false
useLibraryCodeForTypes = false
extraPaths = ["typings"]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 80

[tool.ruff.lint]
ignore = ["F403", "E402"]
exclude = ["**/__init__.py"]

# define package entry
[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
automind = { path = "../automind/", editable = true }
