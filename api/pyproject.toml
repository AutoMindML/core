#:tombi schema.strict = false
[project]
name = "automind-api"
version = "0.1.0"
description = "automl service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # -------------------- math --------------------
  "pandas",
  "numpy",
  "scikit-learn==1.6.1",


  # -------------------- database --------------------
  "sqlalchemy",
  "mindsdb_sdk>=3.1.6",
  "sly",

  # -------------------- console --------------------
  "wcwidth",
  "rich",
  "tqdm",

  # -------------------- driver --------------------
  "pyodbc",
  "pymysql",


  # -------------------- api --------------------
  "fastapi[standard]",
  "fastapi_utils",
  "pydantic",
  "python-multipart",
  "orjson",
  "requests",
  "starlette",

  # -------------------- automind core --------------------
  "automind",

  # -------------------- other --------------------
  "openai",
]

[dependency-groups]
dev = [
  "debugpy",
  "microsoft-python-type-stubs@git+https://github.com/microsoft/python-type-stubs.git",
  "pandas-stubs",
  "pyright",
  "pytest",
  "ruff",
]

# install self
[build-system]
requires = ["setuptools"]

# more setting refer to: https://microsoft.github.io/pyright/#/configuration?id=sample-pyprojecttoml-file
[tool.pyright]
include = ["src"]
disableOrganizeImports = true
reportMissingTypeStubs = false

[tool.ruff]
line-length = 80

[tool.ruff.lint]
ignore = ["F403", "E402"]
exclude = ["**/__init__.py"]

# define package entry
[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
automind = { path = "../automind/", editable = true }
